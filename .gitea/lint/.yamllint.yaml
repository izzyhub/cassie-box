---
# Used by the yamllint pre-commit hook (`task check`). Based on upstream's
# .github/lint/.yamllint.yaml; examples/ is vendored upstream code and not ours to lint.
ignore: |
  .direnv/
  .private/
  .vscode/
  examples/
  result
  result-*
  **/*.sops.yaml

extends: default

rules:
  truthy:
    allowed-values: ["true", "false", "on"]

  comments:
    min-spaces-from-content: 1

  line-length: disable

  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1

  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 0

  indentation: enable
